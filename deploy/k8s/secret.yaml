apiVersion: v1
kind: Secret
metadata:
  name: crypto-bot-secrets
  namespace: default
  labels:
    app: crypto-bot
type: Opaque
stringData:
  # Replace with your actual Bitwarden Secrets Manager access token and identifiers
  BITWARDEN_ACCESS_TOKEN: "your_bitwarden_access_token_here"
  BITWARDEN_ORGANIZATION_ID: "your_bitwarden_organization_id_here"
  BITWARDEN_PROJECT_NAME: "your_bitwarden_project_name_here"
  DATABASE_URL: "postgres://postgres:postgres@postgresql:5432/postgres?sslmode=disable"
