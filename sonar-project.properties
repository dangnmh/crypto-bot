# ──────────────────────────────────────────────────────────────────────
# SonarQube — Project Configuration
# ──────────────────────────────────────────────────────────────────────
# Docs: https://docs.sonarsource.com/sonarqube-server/latest/project-administration/analysis-scope/

# ── Project Identity ─────────────────────────────────────────────────
sonar.projectKey=crypto-bot
sonar.projectName=Crypto Bot
sonar.projectVersion=1.0.0
sonar.host.url=http://localhost:9000
sonar.login=admin
sonar.password=admin1
# ── Source ───────────────────────────────────────────────────────────
sonar.sources=.
sonar.sourceEncoding=UTF-8

# ── Language ─────────────────────────────────────────────────────────
sonar.language=go

# ── Inclusions / Exclusions ──────────────────────────────────────────
# Only analyze business logic — exclude generated, vendor, test, docs.
sonar.inclusions=\
  internal/**/*.go,\
  pkg/**/*.go,\
  cmd/**/*.go

sonar.exclusions=\
  **/*_test.go,\
  **/testutil/mocks/**,\
  **/vendor/**,\
  tools/**,\
  docs/**,\
  guide/**,\
  specs/**

sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/testutil/mocks/**

# ── Coverage ─────────────────────────────────────────────────────────
# Go coverage profile (generated by `go test -coverprofile`)
sonar.go.coverage.reportPaths=.coverage/coverage.out

# ── Test Report ──────────────────────────────────────────────────────
# Go test JSON report (generated by `go test -json`)
sonar.go.tests.reportPaths=.coverage/test-report.json

# ── Lint / External Issues ───────────────────────────────────────────
# golangci-lint checkstyle report
sonar.go.golangci-lint.reportPaths=.coverage/golangci-lint-report.xml

# ── Duplication ──────────────────────────────────────────────────────
# Minimum token length to detect copy-paste (default 100, lower = stricter)
sonar.cpd.minimumTokens=50

# ── Quality Gate ─────────────────────────────────────────────────────
# These thresholds are enforced in SonarQube UI, but documented here:
#   - Coverage on New Code:          ≥ 80%
#   - Duplicated Lines on New Code:  ≤ 3%
#   - Maintainability Rating:        A
#   - Reliability Rating:            A
#   - Security Rating:               A
